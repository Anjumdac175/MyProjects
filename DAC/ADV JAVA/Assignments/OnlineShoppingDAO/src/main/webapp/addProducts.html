<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <title>Products</title>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center m-4">
            <div class="col-6 p-4 shadow bg-success-subtle">
                <form action="addProductServlet" method="post">
                    <div class="mb-3">
                        <label class="form-label">Product Name</label>
                        <input type="text" class="form-control" name="pname" required>
                    </div> 
                    <div class="mb-3">
                        <label class="form-label">Product Description</label>
                        <input type="text" class="form-control" name="pdesc" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Product image</label>
                        <input type="text" class="form-control" name="pimage" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Price</label>
                        <input type="number" class="form-control" name="price" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category Id</label>
                        <input type="number" class="form-control" name="catId" required>
                    </div>
                    <div class="mb-3 text-center">
                        <button type="submit" class="btn btn-primary"> Add Product </button>
                        <a href="AdminDashboard.html" class="btn btn-secondary m-2">Back</a>
                    </div> 
                </form>
            </div>
        </div>
    </div>
</body>
</html>
