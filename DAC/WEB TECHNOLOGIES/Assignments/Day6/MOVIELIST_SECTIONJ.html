<!-- 2.Write js code to read movie data from user and show in table(use bootstrap)
Movie Fields : movieName, actor, release,Movie type(2d,3d,IMAX)(use checkbox), language(Use radio button), show time(Use input type=datetime-local)
 -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <title>Movies List</title>

</head>

<body>
    <div class="container-fluid">
        <div class="row m-5">
            <div class="col-4 mb-5 ">
                <div class="form shadow-lg p-5 bg-success-subtle" id="form" onsubmit="return false">
                    <div class="mb-3">
                        <label for="mname" class="form-label">Movie Name</label>
                        <input type="text" class="form-control" id="mname">
                        <i><small class="text-danger" id="name_error"></small></i>
                    </div>
                    <div class="mb-3">
                        <label for="mactor" class="form-label">Actor</label>
                        <input type="text" class="form-control" id="mactor">
                        <i><small class="text-danger" id="actor_error"></small></i>
                    </div>
                    <div class="mb-3">
                        <label for="release" class="form-label">Release Date</label>
                        <input type="date" class="form-control" id="release">
                    </div>
                    <div class="mb-3">
                        <label for="mtype" class="form-label">Movie Type</label>
                        <input type="checkbox" name="mtype" value="2d" /> 2d
                        <input type="checkbox" name="mtype" value="3d" /> 3d
                        <input type="checkbox" name="mtype" value="imax" /> IMAX
                    </div>
                    <div class="mb-3">
                        <label for="lang" class="form-label">language</label>
                        <input type="radio" name="lang" value="hindi" /> Hindi
                        <input type="radio" name="lang" value="Marathi" /> Marathi
                        <input type="radio" name="lang" value="Telugu" /> Telugu
                    </div>
                    <div class="mb-3">
                        <label for="show" class="form-label">Show Time</label>
                        <input type="datetime-local" class="form-control" id="show">
                    </div>
                    <div class="mt-5 text-center">
                        <button class="btn btn-primary w-50 rounded-4" onclick="display()">Submit</button>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <table class="table table-stripped table-hover">
                    <thead>
                        <tr>
                            <td>Movie Name</td>
                            <td>Actor</td>
                            <td>Release Date</td>
                            <td>Theater Type</td>
                            <td>Language</td>
                            <td>Show Time</td>
                        </tr>
                    </thead>
                    <tbody id="tabledata">

                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
