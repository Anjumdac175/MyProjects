<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <title>Movies</title>
    <script>
        function display() {

            var name = document.getElementById("Mname").value
            var price = document.getElementById("Mprice").value
            var seats = document.getElementById("Mseats").value



            var htmlstr = `<tr>
                    <td>${name}</td>
                    <td>${price}</td>
                    <td>${seats}</td>
                </tr></table>`
            console.log(htmlstr);
            document.getElementById("tableData").innerHTML += htmlstr;
        }
    </script>
</head>

<body class="bg-success-subtle">
    <div class="container-fluid m-5">
        <div class="row align-items-center justify-content-center ">
            <div class="col-4">
                <form id="form" class="border p-4 bg-secondary-subtle shadow-lg " onsubmit="return false">
                    <div class="mb-2">
                        <label for="Name" class="form-label">Movie Name</label>
                        <input type="text" placeholder="Enter movie name " class="form-control form-control-sm"
                            id="Mname" />
                    </div>
                    <div class="mb-2">
                        <label for="Price" class="form-label">Ticket Price</label>
                        <input type="text" placeholder="Enter ticket price " class="form-control form-control-sm"
                            id="Mprice" />
                    </div>
                    <div class="mb-2">
                        <label for="Seat" class="form-label">Seats</label>
                        <input type="text" placeholder="Enter number of seats " class="form-control form-control-sm "
                            id="Mseats" />
                    </div>
                    <div class="mb-2 mt-4 text-center">
                        <button class="btn btn-primary" onclick="display()">submit</button>
                    </div>
                </form>
            </div>
            <div class="col-4 align-items-center p-4">
                <table class="table table-stripped table-hover">
                    <thead>
                        <tr>
                            <td>Movie Name</td>
                            <td>Ticket Price</td>
                            <td>Seats</td>
                        </tr>
                    </thead>
                    <tbody id="tableData">

                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
