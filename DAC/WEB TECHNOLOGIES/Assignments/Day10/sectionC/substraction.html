<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Substraction</title>

    <script>
        function substract() {
            var n1 = document.getElementById("num1").value;
            var n2 = document.getElementById("num2").value;
            var addition = Number(n1) - Number(n2);
            document.getElementById("sub").innerHTML = addition;
        }
    </script>
</head>

<body>
    <div>
        Number1 <input type="text" , name="num1" id="num1"><br>
        Number2 <input type="text" , name="num2" id="num2"> <br> <br>
        <button onclick="substract()">Subtract</button>
        <span id="sub"></span>
    </div>
</body>

</html>
