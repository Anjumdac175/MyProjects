<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <title>Calculator</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <div class="row justify-content-center">
        <div class="col=4"></div>
        <div class="col-4 m-5 p-5 bg-success-subtle shadow rounded-4">
            <form action="/calculate" id="myform" method="POST">
                <h1 class="fw-bold text-center text-primary">Calculator</h1> <br><br>
                <input type="number" name="num1" placeholder="Enter first number" required/>
                <input type="number" name="num2" placeholder="Enter second number" required/>
                <br><br>

                <input type="radio" name="operation" id="add" value="Addition" checked />
                <label for="add">Addition</label>
                <input type="radio" name="operation" id="sub" value="Subtract" />
                <label for="add">Subtract</label>
                <input type="radio" name="operation" id="mul" value="Multiply"/>
                <label for="add">Multiply</label>
                <input type="radio" name="operation" id="divide" value="divide"/>
                <label for="add">Divide</label>
                <input type="radio" name="operation" id="mod" value="Modulus"/>
                <label for="add">Modulus</label>

                <br><br>
                <div class="text-center">
                    <button class="btn btn-primary w-100 rounded-4">Calculate</button>
                </div>
                
            </form>
            <div class="text-center fw-bold py-4">
                <h3 id="result"></h3>
            </div>
            
        </div>
        <div class="col=4"></div>
    </div>
    <script src="calculateinput.js"></script>
</body>
</html>
