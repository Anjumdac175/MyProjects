<!-- 4.Create register page(Name,date of birth,phone,email,gender,language(checkbox),State(dropdown))
     and recieve data on server and repond "Got data"
 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <title>Registration Form</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <div class="row justify-content-center">
        <div class="col-4 m-5 p-5 shadow bg-success-subtle rounded-3">
            <form action="/register" method="POST" id="myform">
                <h2 class="fw-bold text-center mb-5 text-primary">Register</h2>
                <div class="mb-3">
                    <label for="sname" class="form-label fs-5 fw-semibold">Student Name</label>
                    <input type="text" name="sname" id="sname" class="form-control"/>
                </div>
                <div class="mb-3">
                    <label for="dob" class="form-label fs-5 fw-semibold">Date of Birth</label>
                    <input type="date" name="birth" id="dob" class="form-control"/>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label fs-5 fw-semibold">Contact No</label>
                    <input type="number" name="pnumber" id="phone" class="form-control"/>
                </div>
                <div class="mb-3">
                    <label for="mail" class="form-label fs-5 fw-semibold">Email</label>
                    <input type="text" name="email" id="mail" class="form-control"/>
                </div>
                <div class="d-flex justify-content-around">
                    <div class="mb-3">
                        <label for="sex" class="form-label fs-5 fw-semibold">Gender</label> <br>
                        <input type="radio" name="gender" id="sex" value="male"/>Male<br>
                        <input type="radio" name="gender" id="sex" value="female"/>Female<br>
                    </div>
                    <div class="mb-3">
                        <label for="speech" class="form-label fs-5 fw-semibold">Language</label> <br>
                        <input type="checkbox" name="lang" id="speech" value="telugu"/>Telugu<br>
                        <input type="checkbox" name="lang" id="speech" value="hindi"/>Hindi<br>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="state" class="form-label fs-5 fw-semibold">State</label>
                    <select name="statedropdown" id="state" class="form-control">
                        <option value="select">--select--</option>
                        <option value="AP">AP</option>
                        <option value="Telangana">Telangana</option>
                        <option value="Maharastra">Maharastra</option>
                    </select>
                </div>
                <div class="mt-3 text-center">
                    <button class="btn btn-primary w-100 rounded-5 fs-5 fw-semibold">Register</button>
                </div>
            </form>
        </div>
    </div>
    <script src="validation.js"></script>
</body>
</html>
