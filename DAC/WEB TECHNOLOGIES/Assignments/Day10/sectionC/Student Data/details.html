<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>

    <title>Student</title>
</head>
<body>
    <div class="row justify-content-center">
        <div class="col-4 m-5 p-5 shadow bg-primary-subtle rounded-4">
            <h2>Student Details</h2>
            <hr>
            <p id="info"></p>
        </div>
    </div>
    <script>
        $(document).ready(function(){
            const param = new URLSearchParams(window.location.search);
            const id = param.get('id');

            if(!id){
                $("#info").text("No student found");
                return;
            }

            $.ajax({
                url:`/student/${id}`,
                method:'GET',
                success: function(student){
                    const htmlstr = 
                    `<p><strong>Name:</strong>&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;${student.name}</p>
                    <p><strong>Date of Birth:</strong>&ensp;&ensp;&ensp;&ensp;&nbsp;${student.birth} </p>
                    <p><strong>Phone:</strong>&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&nbsp;${student.phone}</p>
                    <p><strong>Email:</strong>&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&nbsp;${student.email}</p>
                    <p><strong>Gender:</strong>&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;${student.gender}</p>
                    <p><strong>Language:</strong>&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;${student.language.join(',')}</p>
                    <p><strong>State:</strong>&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;${student.state}</p>`;

                    $("#info").html(htmlstr);
                }, 
                error: function(){
                    $("#info").text('Student not found');
                }
            });
        });
    </script>
</body>
</html>
