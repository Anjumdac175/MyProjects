<!-- 1.Write js code to read movie data from user and show in table(use bootstrap) and apply following validation
Movie Fields : movieName, actor, release,Movie type(2d,3d,IMAX)(use checkbox), language(Use radio button), show time(Use input type=datetime-local)
a)Movie Name must be of at least 5 characters 
b)Actor name must be of at 3 chars -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <title>BookingMovieshow</title>
    <script>
        function display(){
            var name = $("#mname").val();
            var actor = $("#mactor").val();
            var releasedate = $("#release").val();
            var screentype = []; 
            $("input[type=checkbox]:checked").each(function(){
                screentype.push($(this).val());
            });
            var language = $(".mvlang:checked").val();
            var showtime = $("#show").val();


            var htmlstr = `<tr>
                            <td>${name}</td>
                            <td>${actor}</td>
                            <td>${releasedate}</td>
                            <td>${screentype}</td>
                            <td>${language}</td>
                            <td>${showtime}</td>
                            </tr>`
            $("#tabledata").append(htmlstr);

            $("#myform")[0].reset();
        }
    </script>
</head>

<body>
    <div class="container-fluid">
        <div class="row m-5">
            <div class="col-4 mb-5 ">
                <form class="shadow-lg p-5 bg-success-subtle rounded-3" id="myform" onsubmit="display(); return false">
                    <div class="mb-3">
                        <label for="mname" class="form-label fs-6 fw-semibold">Movie Name</label>
                        <input type="text" class="form-control" id="mname">
                        <i><small class="text-danger" id="name_error"></small></i>
                    </div>
                    <div class="mb-3">
                        <label for="mactor" class="form-label fs-6 fw-semibold">Actor</label>
                        <input type="text" class="form-control" id="mactor">
                        <i><small class="text-danger" id="actor_error"></small></i>
                    </div>
                    <div class="mb-3">
                        <label for="release" class="form-label fs-6 fw-semibold">Release Date</label>
                        <input type="date" class="form-control" id="release">
                    </div>
                    <div  class="d-flex justify-content-around">
                        <div class="mb-3">
                            <label for="stype" class="form-label fs-6 fw-semibold">Movie Type</label><br>
                            <input type="checkbox" id="stype" name="mtype" value="2d" /> 2d <br>
                            <input type="checkbox" name="mtype" value="3d" /> 3d <br>
                            <input type="checkbox" name="mtype" value="imax" /> IMAX
                        </div>
                        <div class="mb-3">
                            <label for="mlang" class="form-label fs-6 fw-semibold">language</label><br>
                            <input type="radio" class="mvlang" id="mlang" name="lang" value="hindi" /> Hindi <br>
                            <input type="radio" class="mvlang" name="lang" value="Marathi" /> Marathi <br>
                            <input type="radio" class="mvlang" name="lang" value="Telugu" /> Telugu
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="show" class="form-label fs-6 fw-semibold">Show Time</label>
                        <input type="datetime-local" class="form-control" id="show">
                    </div>
                    <div class="mt-5 text-center">
                        <button class="btn btn-primary w-100 rounded-4">Submit</button>
                    </div>
                </form>
            </div>
            <div class="col-6  rounded-3">
                <table class="table table-bordered table-success table-hover">
                    <thead>
                        <tr>
                            <td>Movie Name</td>
                            <td>Actor</td>
                            <td>Release Date</td>
                            <td>Theater Type</td>
                            <td>Language</td>
                            <td>Show Time</td>
                        </tr>
                    </thead>
                    <tbody id="tabledata">

                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
