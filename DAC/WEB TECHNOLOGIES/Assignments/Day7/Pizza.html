<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <title>Pizza</title>
    <style>
        .rounded-table{
            border : 1px solid green;
            border-radius: 25px;
            overflow: hidden;
        }
        .rounded-table table{
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container m-5">
        <div class="row">
            <div class="col-4 bg-success-subtle py-4 px-4 shadow border rounded-3">
                <form onsubmit="display(); return false" id="myform">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="col-4">
                            <label for="" class="form-label fs-6 fw-bold">Pizza Name</label>
                        </div>
                        <div class="col-8">
                            <input type="text" class="form-control" id="pizzaname">
                        </div>
                    </div>
                    <hr class="border border-2 border-success">
                    <div class="d-flex justify-content-between mb-4">
                        <div class="col-4">
                            <label for="" class="form-label fs-6 fw-bold">Pizza Topping</label>
                        </div>
                        <div class="col-8">
                            <input type="radio"  name="topping" value="Supreme"> Supreme<br>
                            <input type="radio"  name="topping" value="Vegetarian"> Vegetarian<br>
                            <input type="radio"  name="topping" value="Hawaiian"> Hawaiian<br>
                        </div>
                    </div>
                    <hr class="border border-2 border-success">
                    <div class="d-flex justify-content-between mb-4">
                        <div class="col-4">
                            <label for="" class="form-label fs-6 fw-bold">Pizza Sauce</label>
                        </div>
                        <div class="col-8">
                            <select name="sauce" id="psauce">
                                <option value="choose">----select----</option>
                                <option value="White Sauce">White Sauce</option>
                                <option value="Garlic Sauce">Garlic Sauce</option>
                                <option value="Tomato Sauce">Tomato Sauce</option>
                                <option value="Romensco Sauce">Romensco Sauce</option>
                            </select>
                        </div>
                    </div>
                    <hr class="border border-2 border-success">
                    <div class="d-flex justify-content-betwwen mb-4">
                        <div class="col-4">
                            <label for="" class="form-label fs-6 fw-bold">Optional Extras</label>
                        </div>
                        <div class="col-8">
                            <input type="checkbox" name="extras" id="extras" value="Extra Cheese"> Extra Cheese<br>
                            <input type="checkbox" name="extras" id="extras" value="Gulten Free Base"> Gulten Free Base
                        </div>
                    </div>
                    <hr class="border border-2 border-success">
                    <div class="col-6">
                        <label for="" class="form-label fs-6 fw-bold">Delivery Instructions:</label>
                    </div>
                    <div class="col-4">
                        <textarea name="comments" id="instructions" cols="50" rows="5"></textarea>
                    </div>
                    <div class="mt-4 text-center">
                        <button class="btn btn-success rounded-pill w-50">Send my Order</button>
                    </div>
                </form>
            </div>
            <!-- this is form printing data in a tabular format -->
            <div class="col-8">
                <div class="rounded-table">
                    <table class="table table-bordered table-success">
                        <thead>
                            <tr class="fs-6 fw-bold">
                                <td>Pizza Name</td>
                                <td>Pizza Topping</td>
                                <td>Pizza Sauce</td>
                                <td>Optional Extras</td>
                                <td>Instructions</td>
                            </tr>
                        </thead>
                        <tbody id="printdata">

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="validation.js"></script>
</body>
</html>
