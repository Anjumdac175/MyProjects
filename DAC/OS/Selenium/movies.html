<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .movie-card img {
        height: 300px;
        object-fit: cover;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Welcome to Movie Hub</span>
    </div>
  </nav>

  <div class="container mt-4">
    <h3 class="mb-4 text-center">Recommended Movies</h3>

    <div class="row g-4">

      <div class="col-md-4">
        <div class="card movie-card">
          <img src="kunfu.jpg" class="card-img-top" alt="Movie 1">
          <div class="card-body">
            <h5 class="card-title">Kung-Fu panda</h5>
            <p class="card-text">A mind-bending thriller by Christopher Nolan.</p>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card movie-card">
          <img src="aquaman.jpg" class="card-img-top" alt="Movie 2">
          <div class="card-body">
            <h5 class="card-title">Aquaman</h5>
            <p class="card-text">Exploring space, time, and love across galaxies.</p>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card movie-card">
          <img src="dragon.jpg" class="card-img-top" alt="Movie 3">
          <div class="card-body">
            <h5 class="card-title">How to train your DRagon</h5>
            <p class="card-text">The ultimate Batman vs Joker showdown.</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="m-4 text-right">
    <button type="button" id="logoutbtn" class="btn btn-danger" onclick="handleSubmit()" >Logout</button>
  </div>

<script>

    function handleSubmit(){
        window.location.href = "Login.html";
    }

</script>
</body>
</html>
